name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        working-directory: plugins/engineering-toolkit/skills/engineering-mode/scripts
        run: bun install --frozen-lockfile
      - name: Test
        working-directory: plugins/engineering-toolkit/skills/engineering-mode/scripts
        run: bun run test
      - name: Typecheck
        working-directory: plugins/engineering-toolkit/skills/engineering-mode/scripts
        run: bun run typecheck
      - name: Validate manifests and static invariants
        run: |
          bun -e 'for (const path of [".claude-plugin/marketplace.json", ".agents/plugins/marketplace.json", ".cursor-plugin/marketplace.json", "plugins/engineering-toolkit/.claude-plugin/plugin.json", "plugins/engineering-toolkit/.codex-plugin/plugin.json", "plugins/engineering-toolkit/.cursor-plugin/plugin.json"]) JSON.parse(await Bun.file(path).text())'
          PSTACK_STATIC_ONLY=1 bash tests/skill-collision-repro.sh
